<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Página não encontrada — Emergência Digital</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05070e">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .nf {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 60px 20px;
      background:
        radial-gradient(700px 420px at 50% 0%, rgba(0, 201, 90, 0.16), transparent 60%),
        #05070e;
    }
    .nf__inner { max-width: 480px; }
    .nf__code {
      font-size: clamp(4.5rem, 14vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(120deg, #25e07d, #38e8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf h1 {
      margin-top: 10px;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--text);
    }
    .nf p {
      margin: 14px auto 30px;
      max-width: 420px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.7;
    }
    .nf__brand {
      display: inline-block;
      margin-bottom: 34px;
    }
    .nf__brand img { height: 30px; width: auto; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__inner">
      <a class="nf__brand" href="index.html" aria-label="Emergência Digital — início">
        <img src="assets/logo.png" alt="Emergência Digital" width="708" height="195">
      </a>
      <div class="nf__code">404</div>
      <h1>Página não encontrada</h1>
      <p>O conteúdo que você procura não existe ou foi movido. Volte para a página inicial da Emergência Digital.</p>
      <a class="btn btn--primary btn--lg" href="index.html">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
